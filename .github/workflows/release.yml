name: Release

# 推送 v* 形式的 Tag（例如 v0.2.0）时，编译 arm64 的 NetLink.app 并发布到 Releases。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 编译并自检
        env:
          TAG: ${{ github.ref_name }}
        run: NETLINK_VERSION="${TAG#v}" ./scripts/build.sh

      - name: 确认是 arm64
        run: |
          archs="$(lipo -archs NetLink.app/Contents/MacOS/NetLink)"
          echo "架构：$archs"
          test "$archs" = "arm64"

      - name: 打包
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dmg="NetLink-${TAG}-arm64.dmg"
          ./scripts/make-dmg.sh NetLink.app "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          cat "$dmg.sha256"

      - name: 发布
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="NetLink-${TAG}-arm64.dmg"
          notes="安装：打开 dmg，把 NetLink 拖进「应用程序」，然后在终端执行（这个版本没有签名和公证，需要解除一次隔离）：
          \`xattr -dr com.apple.quarantine /Applications/NetLink.app\`
          打开 NetLink 后导入配置即可。首次打开会自动用 Homebrew 安装 openconnect、autossh，并弹一次系统密码框配置免密 sudo。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dmg" "$dmg.sha256" --clobber
          else
            gh release create "$TAG" "$dmg" "$dmg.sha256" \
              --title "$TAG" --generate-notes --notes "$notes" --verify-tag
          fi
