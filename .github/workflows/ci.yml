name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # 用 Xcode 16 的 SDK 编；build.sh 里固定了最低 macOS 14，产物照样能在 14 上跑。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 工具链
        run: swiftc --version
      - name: 编译并自检
        run: ./scripts/build.sh
      - name: 确认最低系统是 macOS 14
        run: |
          minos="$(otool -l NetLink.app/Contents/MacOS/NetLink | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')"
          echo "最低系统：$minos"
          test "$minos" = "14.0"

  windows:
    # Windows 版：测试、发布、打安装包。安装包作为构建产物保留 7 天，方便在真机上试。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: 编译、测试、打安装包
        shell: pwsh
        run: ./windows/scripts/build.ps1
      - name: 确认安装包在
        shell: pwsh
        run: |
          $setup = Get-ChildItem windows/out -Filter 'NetLink-*-x64-setup.exe'
          if (-not $setup) { throw 'installer missing' }
          $setup | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: NetLink-windows-x64-setup
          path: windows/out/NetLink-*-x64-setup.exe
          retention-days: 7
