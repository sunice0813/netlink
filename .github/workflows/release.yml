name: Release

# 推送 v* 形式的 Tag（例如 v0.2.0）时，编译 arm64 的 NetLink.app 并发布到 Releases。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # 用 Xcode 16 的 SDK 编；build.sh 里固定了最低 macOS 14，产物照样能在 14 上跑。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 工具链
        run: swiftc --version

      - name: 编译并自检
        env:
          TAG: ${{ github.ref_name }}
        run: NETLINK_VERSION="${TAG#v}" ./mac/scripts/build.sh

      - name: 确认是 arm64
        run: |
          archs="$(lipo -archs NetLink.app/Contents/MacOS/NetLink)"
          echo "架构：$archs"
          test "$archs" = "arm64"

      - name: 确认最低系统是 macOS 14
        run: |
          minos="$(otool -l NetLink.app/Contents/MacOS/NetLink | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')"
          echo "最低系统：$minos"
          test "$minos" = "14.0"

      - name: 打包
        env:
          TAG: ${{ github.ref_name }}
        run: |
          dmg="NetLink-${TAG}-arm64.dmg"
          ./mac/scripts/make-dmg.sh NetLink.app "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          cat "$dmg.sha256"

      - name: 发布
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="NetLink-${TAG}-arm64.dmg"
          notes="Install: open the dmg and drag NetLink into Applications, then run this in Terminal (this build isn't signed or notarized, so the quarantine flag has to be removed once):
          \`xattr -dr com.apple.quarantine /Applications/NetLink.app\`
          Then open NetLink and import your config. On first launch it installs openconnect and autossh with Homebrew and asks for your Mac password once to set up passwordless sudo.

          安装：打开 dmg，把 NetLink 拖进「应用程序」，然后在终端执行（这个版本没有签名和公证，需要解除一次隔离）：
          \`xattr -dr com.apple.quarantine /Applications/NetLink.app\`
          打开 NetLink 后导入配置即可。首次打开会自动用 Homebrew 安装 openconnect、autossh，并弹一次系统密码框配置免密 sudo。

          Windows: run NetLink-${TAG}-x64-setup.exe (Windows 10 1809 or later, x64). Allow the UAC prompt once; it installs the app, the bundled openconnect and the background service. SmartScreen may warn because the installer isn't signed: click More info → Run anyway.

          Windows：运行 NetLink-${TAG}-x64-setup.exe（Windows 10 1809 或更新，x64），允许一次 UAC 提示，应用、自带的 openconnect 和后台服务会一起装好。安装包没有签名，SmartScreen 拦截时点「更多信息 → 仍要运行」。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dmg" "$dmg.sha256" --clobber
          else
            gh release create "$TAG" "$dmg" "$dmg.sha256" \
              --title "$TAG" --generate-notes --notes "$notes" --verify-tag
          fi

  windows:
    # Mac 版那一步建好 Release 之后，再把 Windows 安装包传上去。
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: 编译、测试、打安装包
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./windows/scripts/build.ps1 -Version ($env:TAG -replace '^v', '')
      - name: 发布
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG -replace '^v', ''
          $built = "windows/out/NetLink-$version-x64-setup.exe"
          $setup = "NetLink-$($env:TAG)-x64-setup.exe"
          Copy-Item $built $setup
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant()
          "$hash  $setup" | Out-File -Encoding ascii "$setup.sha256"
          Get-Content "$setup.sha256"
          gh release upload $env:TAG $setup "$setup.sha256" --clobber
